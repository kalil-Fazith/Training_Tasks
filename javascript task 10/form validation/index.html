<!DOCTYPE html>
<head>
    <title>Form Validation</title>
    <link rel="stylesheet" href="assets/style/bootstrap.min.css">
    <script src="assets/js/script.js"></script>
</head>
<body>
    <form onsubmit="return show()">
        <div class="text-center border border-secondary w-75 mx-auto">
            <h2 class="text-primary">Form Validation</h2>
            <div>
                <label class="text-warning">First Name*</label>
                <input type="text" id="fName" class="m-2 form-control w-50 mx-auto">
                <div id="fNameError" class="text-danger"></div>
            </div>
            <div>
                <label class="text-warning">last Name*</label>
                <input type="text" id="lName" class="m-2 form-control w-50 mx-auto">
                <div id="lNameError" class="text-danger"></div>
            </div>
            <div>
                <label class="text-warning">Email*</label>
                <input type="text" id="email" class="m-2 form-control w-50 mx-auto" >
                <div id="eMailError" class="text-danger"></div>
            </div>
            <div>
                <label class="text-warning">Phone*</label>
                <input type="text" id="phone" class="m-2 form-control w-50 mx-auto">
                <div id="phoneError" class="text-danger"></div>
            </div>
            <div>
                <label class="text-warning">Zipcode</label>
                <input type="text" id="zipCode" class="m-2 form-control w-50 mx-auto">
                <div id="zipError" class="text-danger"></div>
            </div>
            <div>
                <label class="text-warning">Address</label>
                <input type="text" id="address" class="m-2 form-control w-50 mx-auto">
                <div id="addressError" class="text-danger"></div>
            </div>
            <button type="submit" class="btn btn-danger btn-lg m-2">submit</button>
            <div id="result" class="text-success"></div>
        </div>
    </form>
</body>
