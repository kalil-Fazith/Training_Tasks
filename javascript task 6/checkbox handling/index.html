<!DOCTYPE html>
<head>
    <title>Checkbox handling</title>
    <link rel="stylesheet" href="assets/style/bootstrap.min.css">
    <script src="assets/js/script.js"></script>
</head>
<body>
        <div class="text-center border border-primary p-4" style="margin-top: 15%;  width: 50%; margin-left: 20%;">
            <h1 class="text-success">Checkbox Handling</h1>
            <div class="text-success">
                <input type="checkbox" class="check" name="checkBox">
                <label>checkbox1</label>
            </div>
            <div class="text-success m-1">
                <input type="checkbox" class="check" name="checkBox">
                <label>checkbox2</label>
            </div>
            <div class="text-success m-1">
                <input type="checkbox" class="check" name="checkBox">
                <label>checkbox3</label>
            </div>
            <div class="text-success m-1">
                <input type="checkbox" class="check" name="checkBox">
                <label>checkbox4</label>
            </div>
            <div class="text-success m-1">
                <input type="checkbox" class="check" name="checkBox">
                <label>checkbox5</label>
            </div> 
            <button class="btn btn-primary m-2" onclick="check()">check all</button>
            <button class="btn btn-success m-2" onclick="uncheck()">uncheck all</button>
            <button class="btn btn-secondary m-2" onclick="crossCheck()">cross check all</button>
        </div>
</body>
